name: SDV core CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install -e '.[dev,data,postgres]'
      - run: python -m pytest
      - run: python -m ruff check python scripts
      - name: Run bounded SOME/IP loopback on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_someip_loopback.py --server build/sdv_someip_vehicle_server --client build/sdv_someip_vehicle_client --output artifacts/someip-loopback.json
      - name: Run bounded SOME/IP loopback on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_someip_loopback.py --server build/Release/sdv_someip_vehicle_server.exe --client build/Release/sdv_someip_vehicle_client.exe --output artifacts/someip-loopback.json
      - name: Run runtime idempotency evidence on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_idempotency_evidence.py --executable build/sdv_idempotency_evidence --output artifacts/runtime-idempotency.json
      - name: Run runtime idempotency evidence on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_idempotency_evidence.py --executable build/Release/sdv_idempotency_evidence.exe --output artifacts/runtime-idempotency.json
      - name: Run restart recovery evidence on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_restart_recovery_evidence.py --executable build/sdv_restart_recovery_evidence --output artifacts/runtime-restart-recovery.json
      - name: Run restart recovery evidence on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_restart_recovery_evidence.py --executable build/Release/sdv_restart_recovery_evidence.exe --output artifacts/runtime-restart-recovery.json
      - name: Run runtime concurrency evidence on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_concurrency_evidence.py --executable build/sdv_concurrency_evidence --output artifacts/runtime-concurrency.json
      - name: Run runtime concurrency evidence on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_concurrency_evidence.py --executable build/Release/sdv_concurrency_evidence.exe --output artifacts/runtime-concurrency.json
      - name: Run network recovery evidence on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_network_recovery_evidence.py --server build/sdv_someip_vehicle_server --client build/sdv_someip_body_client --output artifacts/network-recovery.json
      - name: Run network recovery evidence on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_network_recovery_evidence.py --server build/Release/sdv_someip_vehicle_server.exe --client build/Release/sdv_someip_body_client.exe --output artifacts/network-recovery.json
      - name: Run runtime performance matrix on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_performance_matrix.py --executable build/sdv_performance_matrix --output artifacts/runtime-performance-matrix.json
      - name: Run runtime performance matrix on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_performance_matrix.py --executable build/Release/sdv_performance_matrix.exe --output artifacts/runtime-performance-matrix.json
      - name: Run diagnostic lifecycle evidence on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_diagnostic_evidence.py --executable build/sdv_diagnostic_evidence --output artifacts/diagnostic-evidence.json
      - name: Run diagnostic lifecycle evidence on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_diagnostic_evidence.py --executable build/Release/sdv_diagnostic_evidence.exe --output artifacts/diagnostic-evidence.json
      - name: Run typed diagnostic service evidence on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_diagnostic_service_evidence.py --executable build/sdv_diagnostic_service_evidence --output artifacts/diagnostic-service-evidence.json
      - name: Run typed diagnostic service evidence on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_diagnostic_service_evidence.py --executable build/Release/sdv_diagnostic_service_evidence.exe --output artifacts/diagnostic-service-evidence.json
      - name: Run deterministic replay pipeline on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_replay_pipeline.py --gateway-bin build/sdv_gateway_cli --output artifacts/replay-report.json
      - name: Run deterministic replay pipeline on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_replay_pipeline.py --gateway-bin build/Release/sdv_gateway_cli.exe --output artifacts/replay-report.json
      - name: Run leased replay workers on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_scheduled_replay.py --gateway-bin build/sdv_gateway_cli --output artifacts/scheduled-replay.json
      - name: Run leased replay workers on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_scheduled_replay.py --gateway-bin build/Release/sdv_gateway_cli.exe --output artifacts/scheduled-replay.json
      - name: Build and verify normalized Parquet replay dataset
        run: python scripts/build_replay_storage.py --output artifacts/replay-storage.json
      - name: Run frozen cross-process scenarios on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_frozen_scenarios.py --gateway-bin build/sdv_gateway_cli --output artifacts/scenario-report.json
      - name: Run frozen cross-process scenarios on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_frozen_scenarios.py --gateway-bin build/Release/sdv_gateway_cli.exe --output artifacts/scenario-report.json
      - name: Run four-node integration lab on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_multinode_lab.py --gateway-bin build/sdv_gateway_cli --output artifacts/multinode-report.json
      - name: Run four-node integration lab on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_multinode_lab.py --gateway-bin build/Release/sdv_gateway_cli.exe --output artifacts/multinode-report.json
      - name: Run 200 frozen system scenarios on Linux
        if: runner.os == 'Linux'
        run: python scripts/run_system_scenarios.py --gateway-bin build/sdv_gateway_cli --output artifacts/system-scenario-report.json
      - name: Run 200 frozen system scenarios on Windows
        if: runner.os == 'Windows'
        run: python scripts/run_system_scenarios.py --gateway-bin build/Release/sdv_gateway_cli.exe --output artifacts/system-scenario-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-report-${{ matrix.os }}
          path: artifacts/
  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DSDV_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitize
      - run: ctest --test-dir build-sanitize --output-on-failure
  postgres-replay-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sdv_replay
          POSTGRES_USER: sdv
          POSTGRES_PASSWORD: sdv-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdv -d sdv_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: python -m pip install -e '.[dev,data,postgres]'
      - name: Run PostgreSQL replay workers and lease controls
        run: >-
          python scripts/run_postgres_replay.py
          --dsn "postgresql://sdv:sdv-ci-password@localhost:5432/sdv_replay"
          --gateway-bin build/sdv_gateway_cli
          --output artifacts/postgres-replay.json
          --workers 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-replay-integration
          path: artifacts/

