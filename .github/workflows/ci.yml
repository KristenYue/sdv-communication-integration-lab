name: SDV core CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check python scripts
  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DSDV_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitize
      - run: ctest --test-dir build-sanitize --output-on-failure

