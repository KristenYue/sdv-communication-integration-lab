name: Linux SocketCAN evidence
on:
  push:
    paths: ['python/**', 'scripts/verify_vcan.py', 'examples/vehicle.dbc', '.github/workflows/vcan.yml']
  pull_request:
    paths: ['python/**', 'scripts/verify_vcan.py', 'examples/vehicle.dbc', '.github/workflows/vcan.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vcan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - name: Create virtual CAN interface
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          ip -details link show vcan0 > artifacts/vcan-interface.txt
      - name: Run actual SocketCAN loopback
        run: python scripts/verify_vcan.py --interface vcan0 --output artifacts/linux-vcan.json
      - name: Feed virtual ECUs into the C++ gateway
        run: |
          set -euo pipefail
          ./build/sdv_socketcan_gateway --interface vcan0 --count 2 --output artifacts/cpp-vcan.json &
          gateway_pid=$!
          sleep 0.2
          python scripts/send_vcan_frames.py --interface vcan0
          wait "$gateway_pid"
          python scripts/verify_cpp_vcan_report.py --report artifacts/cpp-vcan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-vcan-evidence
          path: artifacts/
